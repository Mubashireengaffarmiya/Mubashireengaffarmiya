<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Mubashireen Shaik — developer profile banner</title>
  <desc id="description">A light-mode developer banner with a blue and violet digital grid and a terminal-inspired graphic.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f2edff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087eaa"/>
      <stop offset="0.55" stop-color="#4368e8"/>
      <stop offset="1" stop-color="#8054cf"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#527bce" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="304" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <path d="M0 292C228 242 368 330 594 282S966 230 1200 282" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.65"/>
  <rect x="835" y="86" width="250" height="166" rx="16" fill="#fff" fill-opacity="0.8" stroke="#7894d5" stroke-opacity="0.55"/>
  <path d="M835 118H1085" stroke="#7894d5" stroke-opacity="0.45"/>
  <circle cx="857" cy="102" r="4" fill="#ef7f91"/>
  <circle cx="874" cy="102" r="4" fill="#efc264"/>
  <circle cx="891" cy="102" r="4" fill="#57b790"/>
  <path d="M873 151L892 168L873 185" fill="none" stroke="#3766d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M905 187H967" stroke="#7657cf" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1043" cy="213" r="5" fill="#0c91b3">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="110" fill="#3657a5" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="5">DEVELOPER PROFILE / 001</text>
  <text x="78" y="184" fill="#101b3a" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">MUBASHIREEN SHAIK</text>
  <text x="82" y="228" fill="#364b78" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="1">COMPUTER SCIENCE  /  SOFTWARE  /  AI</text>
  <text x="82" y="290" fill="#3b68cc" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">REVA UNIVERSITY  ·  BENGALURU, INDIA</text>
</svg>
